<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Core — Fundsroom ERP</title>
    <script>
      // Applied before React mounts (and before first paint) so switching
      // themes and reloading never flashes the previous theme. Kept as a
      // small inline script rather than a module import so it runs
      // synchronously, ahead of any JS bundle fetch. The theme id list is
      // duplicated in src/theme.ts — both must stay in sync when a theme is
      // added or removed.
      (function () {
        try {
          var VALID = ['nexus', 'meadow', 'abyss', 'ember']
          var saved = localStorage.getItem('fundsroom.theme.v1')
          var theme = VALID.indexOf(saved) !== -1 ? saved : 'nexus'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'nexus'
        }
      })()
    </script>

    <!-- Aetheric Enterprise typefaces + Material Symbols icons (Stitch design) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
