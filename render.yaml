services:
  - type: web
    name: fundsroom-erp-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    # NODE_ENV=production makes npm skip devDependencies, but the build needs
    # them (prisma CLI + tsc live there). --include=dev forces them in.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: JWT_ISSUER
        value: fundsroom-erp
      - key: JWT_AUDIENCE
        value: fundsroom-web
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      # Optional AI copilot (Groq/OpenAI-compatible). Without a key the AI
      # endpoints return a clean 503 and the rest of the API is unaffected.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      # Notification agent. AGENT_SECRET authenticates the scheduled scan;
      # without it only a signed-in ADMIN can trigger one (fails closed).
      - key: AGENT_SECRET
        generateValue: true
      # Email delivery (Resend). Optional — the agent still records alerts
      # in-app when these are unset, it just doesn't send mail.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: APP_URL
        sync: false
